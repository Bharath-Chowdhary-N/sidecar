preloads:
  - /snpit_env/configs/${SNPIT_DEFAULT_CONFIG}

replaceable_preloads:
  - /home/environment/nov2025_container_config.yaml

photometry:
  sidecar:
    diaobject:
      diaobject_provenance_tag: "nov2025_test3"
      diaobject_process: "sidecar"

    sfft:
      back_size: 64
      back_filtersize: 3
      detect_threshold: 1.5
      detect_minarea: 5
      detect_maxarea: 0
      verbose_level: 2
      radius_cut_detmask: 1
      esatur_key: "esatur"

    candidate:
      threshold: 100
      threshold_column: "peak_value"

    real_bogus:
      # Detections with real_bogus_score >= threshold are labelled "real".
      threshold: 0.5
      # Where the Hugging Face model ensemble is downloaded and cached.
      # null -> ~/roman_sn_pit_models
      model_dir: null
      # Where to run the CNNs: auto (GPU if available), cpu, or cuda.
      device: auto

    psf:
      type: STPSF
